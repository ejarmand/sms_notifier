[project]
name = "sms-notifier-server"
version = "0.2.0"
description = "Authenticated Twilio send and inbox service"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=46.0.0,<47",
    "flask>=3.1.0,<4",
    "gunicorn>=23.0.0,<24",
    "twilio>=9.8.0,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blueprints", "src"]

[tool.hatch.build.targets.wheel.force-include]
"sms_notifier.py" = "sms_notifier.py"
