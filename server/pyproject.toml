[project]
name = "sms-notifier-server"
version = "0.3.0"
description = "Private tailnet Twilio send and inbox service"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.0,<3",
    "flask>=3.1.0,<4",
    "gunicorn>=23.0.0,<24",
    "twilio>=9.8.0,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"sms_notifier.py" = "sms_notifier.py"
