[project]
name = "sms-notifier-client"
version = "0.2.0"
description = "Direct HTTP client for the SMS Notifier service"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46.0.0,<47",
    "requests>=2.32.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sms_client"]
